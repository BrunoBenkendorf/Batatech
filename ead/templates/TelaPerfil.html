<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>BataTECH Cursos EAD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% load static %}
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'cad.css' %}">
  <link rel="icon" type="image/png" href="{% static 'imagens/favicon.png' %}">
</head>

<body class="bg-custom font-sans flex items-center justify-center min-h-screen">
  <script src="{% static 'js/configglobal.js' %}"></script>


  <div class="bg-white w-full max-w-4xl rounded shadow-md p-6">
    <h2 class="cad">Editar Perfil</h2>

    <!-- Formulário -->
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="flex gap-8">

        <!-- Coluna da Imagem -->
        <div class="flex flex-col items-center w-1/3">
          <label class="text-sm font-semibold mt-2 mb-1">Foto de Perfil</label>

          {% if usuario.foto_perfil %}
          <img src="{{ usuario.foto_perfil.url }}" alt="Foto de Perfil"
            class="mt-2 max-h-52 rounded-full border object-cover">
          {% else %}
          <img src="{% static 'imagens/default-user.png' %}" alt="Foto de Perfil"
            class="mt-2 max-h-52 rounded-full border object-cover">
          {% endif %}

          <input type="file" name="foto_perfil" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 
            file:rounded-lg file:border-0 file:text-sm file:font-semibold 
            file:bg-orange-600 file:text-white hover:file:bg-orange-700 cursor-pointer mt-4" />

        </div>

        <!-- Coluna dos Dados -->
        <div class="flex-1 space-y-4">
          <div class="flex gap-4">
            <div class="w-1/2">
              <label class="block text-sm font-semibold mb-1">Nome</label>
              <input type="text" name="nome" value="{{ nome }}" required class="w-full border px-3 py-2 rounded">
            </div>
            <div class="w-1/2">
              <label class="block text-sm font-semibold mb-1">Sobrenome</label>
              <input type="text" name="sobrenome" value="{{ sobrenome }}" required
                class="w-full border px-3 py-2 rounded">
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">E-mail</label>
            <input type="email" name="email" value="{{ usuario.email }}" required
              class="w-full border px-3 py-2 rounded">
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">Telefone</label>
            <input type="tel" name="telefone" value="{{ usuario.telefone }}" class="w-full border px-3 py-2 rounded">
          </div>

          {% if perfil_tipo == "professor" %}
          <div>
            <label class="block text-sm font-semibold mb-1">Formação Acadêmica</label>
            <input type="text" name="formacao" value="{{ usuario.formacao }}" class="w-full border px-3 py-2 rounded">
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">Experiência Profissional</label>
            <textarea name="experiencia" rows="3"
              class="w-full border px-3 py-2 rounded">{{ usuario.experiencia }}</textarea>
          </div>
          {% endif %}

          <div class="flex gap-4">
            <div class="w-1/2">
              <label class="block text-sm font-semibold mb-1">Senha</label>
              <input type="password" name="senha" placeholder="Deixe em branco para não alterar"
                class="w-full border px-3 py-2 rounded">
            </div>
            <div class="w-1/2">
              <label class="block text-sm font-semibold mb-1">Confirmar Senha</label>
              <input type="password" name="confirma_senha" placeholder="Deixe em branco para não alterar"
                class="w-full border px-3 py-2 rounded">
            </div>
          </div>

          <!-- Botões -->
          <div class="pt-4 flex gap-4">
            <a href="javascript:history.back()" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded">Voltar</a>
            <button type="submit" class="bg-orange-600 hover:bg-orange-700 px-4 py-2 text-white rounded">Salvar</button>
          </div>

        </div>
      </div>
    </form>
  </div>

</body>

</html>
