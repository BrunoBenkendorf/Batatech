<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>BataTECH Cursos EAD - Criar Fórum</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% load static %}
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'cad.css' %}">
  <link rel="icon" type="image/png" href="{% static 'imagens/favicon.png' %}">
</head>

<body class="bg-custom font-sans min-h-screen flex items-center justify-center">
  <script src="{% static 'js/configglobal.js' %}"></script>

  <div class="max-w-xl w-full mx-auto p-6 bg-white shadow-md rounded-lg mt-20">

    <div class="text-center mb-6">
      <h1 class="text-2xl font-semibold">Criar Fórum</h1>
      <p class="text-gray-600 text-sm">Preencha os dados abaixo para criar um novo fórum.</p>
    </div>

    <form method="POST" class="space-y-4">
      {% csrf_token %}

      <select name="curso_id" required class="w-full border rounded px-3 py-2">
        <option value="">Selecione o Curso</option>
        {% for curso in cursos %}
          <option value="{{ curso.id_curso }}">{{ curso.nome }}</option>
        {% endfor %}
      </select>

      <input type="text" name="titulo" placeholder="Título do Fórum" required class="w-full border rounded px-3 py-2" />

      <textarea name="descricao" placeholder="Descrição do Fórum" rows="4" required class="w-full border rounded px-3 py-2"></textarea>

      <div class="text-center space-x-4 pt-4">
        <a href="javascript:history.back()" class="btn btn-white btn-animated">Voltar</a>
        <button type="submit" class="btn btn-white btn-animated">Criar Fórum</button>
      </div>
    </form>

  </div>
</body>

</html>
