<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>BataTECH Cursos EAD</title>
  {% load static %}
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'cad.css' %}">
  <link rel="icon" type="image/png" href="{% static 'imagens/favicon.png' %}">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4 py-10">
  <script src="{% static 'js/configglobal.js' %}"></script>

  <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-xl">
    <h1 class="cad">Editar Arquivo</h1>

    <form method="post" enctype="multipart/form-data" class="space-y-5">
      {% csrf_token %}

      <div>
        <label for="tipo" class="block font-semibold mb-1">Tipo</label>
        <select name="tipo" id="tipo" class="w-full border px-3 py-2 rounded" required>
          <option value="atividade" {% if arquivo.tipo == 'atividade' %}selected{% endif %}>Atividade</option>
          <option value="pdf" {% if arquivo.tipo == 'pdf' %}selected{% endif %}>PDF</option>
          <option value="video" {% if arquivo.tipo == 'video' %}selected{% endif %}>Vídeo</option>
        </select>
      </div>

      <div>
        <label for="descricao" class="block font-semibold mb-1">Descrição</label>
        <input type="text" name="descricao" id="descricao" class="w-full border px-3 py-2 rounded" value="{{ arquivo.descricao }}" required>
      </div>

      <div>
        <label for="arquivo" class="block font-semibold mb-1">Novo Arquivo (opcional)</label>
        <input type="file" name="arquivo" id="arquivo" class="w-full border px-3 py-2 rounded">
        <p class="text-sm text-gray-500 mt-1">Se não for substituir o arquivo atual, deixe em branco.</p>
      </div>

      <div class="flex justify-between pt-4">
        <a href="{% url 'Altera' %}?id={{ curso_id }}" class="text-blue-500 hover:underline">← Voltar</a>
        <button type="submit" class="bg-orange-600 text-white px-4 py-2 rounded">Salvar Alterações</button>
      </div>
    </form>
  </div>

</body>
</html>
