<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>BataTECH Cursos EAD</title>
  {% load static %}
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="{% static 'imagens/favicon.png' %}" type="image/png" />
</head>

<body class="bg-yellow-100 min-h-screen p-6">
  <script src="{% static 'js/configglobal.js' %}"></script>
  <div class="max-w-4xl mx-auto bg-white p-8 rounded shadow">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">📋 Provas Realizadas</h2>

    {% if avaliacoes %}
    <ul class="space-y-4">
      {% for avaliacao in avaliacoes %}
      <li class="flex items-center justify-between bg-gray-50 p-4 rounded border">
        <span class="text-lg font-semibold text-gray-700">{{ avaliacao.titulo }}</span>
        <a href="{% url 'visualizar_resultados' avaliacao.id_avaliacao %}"
          class="text-white bg-orange-500 hover:bg-orange-600 px-4 py-2 rounded transition">
          Ver Resultado
        </a>
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p class="text-gray-600">Você ainda não respondeu nenhuma prova.</p>
    {% endif %}

    <div class="mt-8">
      <a href="javascript:history.back()" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded">Voltar</a>
    </div>
  </div>
</body>

</html>
